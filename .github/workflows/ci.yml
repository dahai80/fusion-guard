name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # AuditStore::open → TokenStore::load_or_create_key 在非交互环境会卡 Keychain
  # SecItemCopyMatching 60s+。CI 注入固定 hex 32B key (dev/CI 路径, 非 prod Keychain)。
  # release build 经 P2-1 门控: 需 FUSION_GUARD_ALLOW_ENV_KEY=1 或 --insecure-env-key 才读 env key。
  # CI 用 cargo test (debug) 不经 release 门控, 直接读 env key。
  FUSION_GUARD_TOKEN_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  rust-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --all-targets
      - name: test
        run: cargo test
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build release
        run: cargo build --release
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fusion-guard
          path: target/release/fusion-guard

  swift-bridge:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: check tcc-bridge scaffolding
        run: |
          echo "Phase 0: Swift tcc-bridge deferred to Phase 5 (E1 scope-narrowed to status query)"
          echo "Job reserved for independent Swift CI lane per PRD §15"
          test -f Cargo.toml || { echo "missing Cargo.toml"; exit 1; }
