[package]
name = "fg-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
fg-core.workspace = true
fg-rules.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
aes-gcm.workspace = true
security-framework.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
zeroize.workspace = true
rand = "0.8"
# secret_store: shared secret 生成 hex 编码 (prod 路径, 非 dev-only)。
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid.workspace = true
rusqlite.workspace = true
tempfile = "3"
chrono.workspace = true
sha2.workspace = true
hmac.workspace = true

[features]
default = []
# test-helpers: 暴露链构造内部供集成测试注入带指定 ts 的合法链行 (rotation 测试需旧行)。
# 非生产路径, 不默认开启。
test-helpers = []

[[test]]
name = "rotation_test"
required-features = ["test-helpers"]

[[test]]
name = "p05_chain_test"
required-features = ["test-helpers"]

[[test]]
name = "p12_key_separation_test"
required-features = ["test-helpers"]

[[test]]
name = "p16_audit_filter_test"
required-features = ["test-helpers"]

[[test]]
name = "p17_write_split_test"
required-features = ["test-helpers"]

[[test]]
name = "p21_env_key_gating_test"
required-features = ["test-helpers"]

# H-D: confirm 跨库事务崩溃恢复级一次性 (restart-replay) + H-A: 审计链并发混合风险单写者。
# 复用已有 action_test.rs / chain_test.rs (不需 test-helpers, 仅调公开 API)。
[[test]]
name = "hd_confirm_restart_replay_test"
required-features = ["test-helpers"]

# H-E: 主密钥丢失检测 (token_db_is_virgin) + allow_mint 拒绝决策门控 (不触真实 Keychain)。
[[test]]
name = "he_key_loss_test"
required-features = ["test-helpers"]

# H-E (item c+d): 轮换后全 4 链 (audit/tcc/rules/dead-letter) + token 可验 + 密钥丢失 vs 真篡改区分。
[[test]]
name = "he_key_loss_distinguish_test"
required-features = ["test-helpers"]

[lints]
workspace = true
