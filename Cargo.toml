[workspace]
resolver = "2"
members = [
    "crates/fg-core",
    "crates/fg-rules",
    "crates/fg-audit-engine",
    "crates/fg-redact",
    "crates/fg-tcc",
    "crates/fg-ipc",
    "crates/fg-store",
    "crates/fg-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Fusion-MLX Team"]

[workspace.dependencies]
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }

# 日志追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 通用工具
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
shell-words = "1"

# UDS socket + peercred (E6: LOCAL_PEERCRED 校验, 移植 fusion-speech 范式)
nix = { version = "0.27", features = ["socket"] }
libc = "0.2"

# 持久化 (§13.2 SQLite WAL) + 加密 token store (§8.2 H6)
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
security-framework = "2"

# 内部 crate
fg-core = { path = "crates/fg-core" }
fg-rules = { path = "crates/fg-rules" }
fg-audit-engine = { path = "crates/fg-audit-engine" }
fg-redact = { path = "crates/fg-redact" }
fg-tcc = { path = "crates/fg-tcc" }
fg-ipc = { path = "crates/fg-ipc" }
fg-store = { path = "crates/fg-store" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
